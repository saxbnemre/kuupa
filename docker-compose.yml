version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: kuupa-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
    container_name: kuupa-backend
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-5000}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/kuupa}
    depends_on:
      - mongo
    restart: unless-stopped

  scraper:
    build:
      context: ./workers
    container_name: kuupa-scraper
    env_file:
      - .env
    environment:
      - API_URL=${API_URL:-http://backend:5000/api/v1}
    depends_on:
      - backend
    # Since scraper runs once and stops, it shouldn't be restarted automatically
    # restart: on-failure

volumes:
  mongo-data:
