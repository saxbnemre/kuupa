name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio
        pip install -r workers/requirements.txt
        
    - name: Run Scraper Tests (Pytest)
      run: |
        python -m pytest tests/test_scraper.py
        
    - name: Install & Build Backend
      run: |
        cd backend
        npm install
        npm run build
        
    - name: Run Backend Tests (Jest)
      run: |
        cd backend
        npm test
        
    - name: Install & Build Extension
      run: |
        cd extension
        npm install
        npm run build
        
    - name: Install & Build Website
      run: |
        cd website
        npm install
        npm run build
        
    - name: Run QA Tests (Playwright E2E)
      run: |
        cd tests
        npm install
        npx playwright install --with-deps chromium
        npx playwright test e2e/
